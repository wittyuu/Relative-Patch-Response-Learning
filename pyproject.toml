[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prl"
version = "0.1.0"
description = "Relative Patch Response Learning for generalizable AI-generated image detection"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["prl*"]
